name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        env:
          # LightDock (Python < 3.12) has C extensions that GCC 14+ rejects
          # by default; install.sh and the Dockerfile set the same flag.
          CFLAGS: -Wno-error=incompatible-pointer-types
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest -q tests

  cli:
    name: cli smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The interface only needs rich and prompt_toolkit (see README).
      - name: Install interface dependencies
        run: pip install "rich>=13" prompt_toolkit
      - name: Check shell script syntax
        run: |
          for f in chemlink $(git ls-files '*.sh'); do
            bash -n "$f"
          done
      - name: Run the CLI
        env:
          CHEMLINK_PYTHON: python
        run: |
          ./chemlink --version
          ./chemlink --help > /dev/null
          ./chemlink demo --plain

  package:
    name: package build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      # Run from outside the checkout so nothing is imported from the source tree.
      - name: Check the installed package
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/chemlink --version
          /tmp/wheel-env/bin/chemlink --help > /dev/null
          /tmp/wheel-env/bin/chemlink demo --plain
          /tmp/wheel-env/bin/python -I -c "
          import importlib, pkgutil, chemlink
          for m in pkgutil.walk_packages(chemlink.__path__, 'chemlink.'):
              importlib.import_module(m.name)
          "
