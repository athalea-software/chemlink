name: Bug report
description: Something in ChemLink fails or gives a wrong result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security problems, do not
        open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact `chemlink` command (or TUI form) you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output and logs
      description: |
        The error panel, and the relevant part of the run's log file
        (for example `simulation.log`). Re-running with `--debug` adds the traceback.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: "`chemlink doctor` output"
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChemLink version
      description: Output of `chemlink --version`.
      placeholder: chemlink 2.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How ChemLink is installed
      options:
        - install.sh
        - install.sh --full
        - Docker
        - git checkout
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where it runs
      options:
        - Single machine
        - SLURM cluster (chemlink hpc)
        - Docker
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Input files
      description: |
        If you can share them, attach the receptor/ligand/peptide files (zip them
        if needed) or point to a public structure (PDB ID, PubChem CID).
